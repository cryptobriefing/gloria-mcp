name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) under io.github.cryptobriefing-labs/gloria-mcp.
#
# Auth is GitHub Actions OIDC. The registry reads the OIDC token's
# repository_owner claim (cryptobriefing-labs) and grants the
# io.github.cryptobriefing-labs/* namespace. No secret, no device-flow login.
#
# This workflow is intentionally separate from:
#   - prod.yml     (AWS deploy, runs on push to main). This workflow never runs
#                   on a branch push, so it does not touch the production deploy.
#   - publish.yml  (PyPI, runs on a published Release). This workflow uses a
#                   dedicated mcp-registry-v* tag, not the v* tags / releases
#                   that drive PyPI, so it never publishes a package.
#
# Triggers:
#   - workflow_dispatch: manual re-publish (available once this file is on the
#     default branch).
#   - push of a tag matching mcp-registry-v*: e.g. mcp-registry-v1.0.0.

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-registry-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
